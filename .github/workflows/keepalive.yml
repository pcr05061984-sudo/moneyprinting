name: 24/7 Keep-Alive & Cloud Monitor

on:
  schedule:
    # Run every 10 minutes to ensure Render free tier never sleeps
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping MoneyPrinterTurbo Render Health Endpoint
        run: |
          echo "Pinging MoneyPrinterTurbo Render Cloud..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://moneyprinting-xych.onrender.com/health)
          echo "Render Health HTTP Status: $STATUS"
          if [ "$STATUS" -ne 200 ]; then
            echo "Warning: Health endpoint returned $STATUS"
            # Retry once after 5 seconds
            sleep 5
            curl -f -s https://moneyprinting-xych.onrender.com/health || true
          else
            echo "Service is 100% ONLINE and AWAKE! 🚀"
          fi
